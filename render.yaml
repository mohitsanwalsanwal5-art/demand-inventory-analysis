services:
  - type: web
    name: foresight-dashboard
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app/app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

  - type: web
    name: foresight-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn service.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
